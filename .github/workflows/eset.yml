name: Account and Key Generator

on:
  # schedule: #if need schedule
  #   - cron: "0 */2 * * *"

  workflow_dispatch:
    inputs:
      account:
        description: 'Number of Accounts to be generated (default = 0)'
        required: false
        default: '0'
        type: string

      key:
        description: 'Number of Keys to be generated (default = 1)'
        required: false
        default: '1'
        type: string

      mail:
        description: 'Choose the mail provider to generate license'
        required: true
        type: choice
        options:
          - 1secmail
          - guerrillamail
          - developermail
          - mailticking
          - fakemail
          - inboxes
          - incognitomail
          - emailfake
        default: emailfake

      key_type:
        description: 'Modes of operation'
        required: true
        type: choice
        options:
          - --key
          - --small-business-key
        default: --key

      os:
        description: 'Operating System of runner (Linux, macOS, Windows)'
        required: true
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        default: windows-latest

      branch:
        description: "Repository branch (don't touch it if you don't know what it is!!!)"
        required: false
        type: choice
        options:
          - main
          - test
        default: main


jobs:
  generate-account-and-key:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.os || 'windows-latest' }}

    steps:

      # =========================================================
      # SET VARIABLES
      # =========================================================
      - name: Set Variables
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "account=${{ github.event.inputs.account }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ github.event.inputs.key }}" >> "$GITHUB_OUTPUT"
            echo "mail=${{ github.event.inputs.mail }}" >> "$GITHUB_OUTPUT"
            echo "key_type=${{ github.event.inputs.key_type }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "account=0" >> "$GITHUB_OUTPUT"
            echo "key=1" >> "$GITHUB_OUTPUT"
            echo "mail=emailfake" >> "$GITHUB_OUTPUT"
            echo "key_type=--key" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi


      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # PREPARE EMAIL BODY
      # =========================================================
      - name: Prepare Email Body
        shell: bash
        run: |
          EMAIL_FILE="$GITHUB_WORKSPACE/email-body.txt"

          {
            echo "Witam witam,"
            echo "=================================================="
            echo "GENERATED OUTPUT"
            echo "=================================================="
            echo
          } > "$EMAIL_FILE"


      # =========================================================
      # CLONE ETKG REPOSITORY
      # =========================================================
      - name: Clone Repository
        run: |
          git clone -b "${{ steps.vars.outputs.branch }}" https://github.com/shadowcopyrz/etkg.git


      # =========================================================
      # LINUX / MACOS
      # =========================================================
      - name: Setup & Run Script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd etkg

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install python@3.11 || true
          else
            sudo apt update
            sudo apt install -y python3-pip python3-venv
          fi

          python3 -m venv venv
          source venv/bin/activate

          pip install -r requirements.txt

          ACCOUNT="${{ steps.vars.outputs.account }}"
          KEY="${{ steps.vars.outputs.key }}"
          MAIL="${{ steps.vars.outputs.mail }}"
          KEY_TYPE="${{ steps.vars.outputs.key_type }}"

          EMAIL_FILE="$GITHUB_WORKSPACE/email-body.txt"

          # Generate accounts
          if [[ "$ACCOUNT" != "0" ]]; then
            python3 main.py \
              --auto-detect-browser \
              --account \
              --email-api "$MAIL" \
              --skip-update-check \
              --no-logo \
              --disable-progress-bar \
              --disable-logging \
              --repeat "$ACCOUNT"

            echo "Account:" >> "$EMAIL_FILE"

            cat ./*ACCOUNTS.txt >> "$EMAIL_FILE" 2>/dev/null || \
              echo "None" >> "$EMAIL_FILE"

            echo >> "$EMAIL_FILE"
          fi

          # Generate keys
          if [[ "$KEY" != "0" ]]; then
            python3 main.py \
              --auto-detect-browser \
              "$KEY_TYPE" \
              --email-api "$MAIL" \
              --skip-update-check \
              --no-logo \
              --disable-progress-bar \
              --disable-logging \
              --repeat "$KEY"

            echo "Key:" >> "$EMAIL_FILE"

            cat ./*KEYS.txt >> "$EMAIL_FILE" 2>/dev/null || \
              echo "None" >> "$EMAIL_FILE"

            echo >> "$EMAIL_FILE"
          fi

          # Footer
          {
            echo "=================================================="
            echo
            echo "GitHub Actions run:"
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This email was automatically generated by GitHub Actions."
          } >> "$EMAIL_FILE"


      # =========================================================
      # WINDOWS
      # =========================================================
      - name: Setup & Run Script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd etkg

          python -m venv venv
          .\venv\Scripts\pip install -r requirements.txt
          .\venv\Scripts\Activate.ps1

          $ACCOUNT = "${{ steps.vars.outputs.account }}"
          $KEY = "${{ steps.vars.outputs.key }}"
          $MAIL = "${{ steps.vars.outputs.mail }}"
          $KEY_TYPE = "${{ steps.vars.outputs.key_type }}"

          $EMAIL_FILE = Join-Path $env:GITHUB_WORKSPACE "email-body.txt"

          # Generate accounts
          if ($ACCOUNT -ne 0) {

            python main.py `
              --auto-detect-browser `
              --account `
              --email-api "$MAIL" `
              --skip-update-check `
              --no-logo `
              --disable-progress-bar `
              --disable-logging `
              --repeat $ACCOUNT

            Add-Content -Path $EMAIL_FILE -Value "Account:"

            if (Test-Path ./*ACCOUNTS.txt) {
              Get-Content ./*ACCOUNTS.txt |
                Add-Content -Path $EMAIL_FILE
            }
            else {
              Add-Content -Path $EMAIL_FILE -Value "None"
            }

            Add-Content -Path $EMAIL_FILE -Value ""
          }

          # Generate keys
          if ($KEY -ne 0) {

            python main.py `
              --auto-detect-browser `
              "$KEY_TYPE" `
              --email-api "$MAIL" `
              --skip-update-check `
              --no-logo `
              --disable-progress-bar `
              --disable-logging `
              --repeat $KEY

            Add-Content -Path $EMAIL_FILE -Value "Key:"

            if (Test-Path ./*KEYS.txt) {
              Get-Content ./*KEYS.txt |
                Add-Content -Path $EMAIL_FILE
            }
            else {
              Add-Content -Path $EMAIL_FILE -Value "None"
            }

            Add-Content -Path $EMAIL_FILE -Value ""
          }

          # Footer
          Add-Content -Path $EMAIL_FILE -Value "=================================================="
          Add-Content -Path $EMAIL_FILE -Value ""
          Add-Content -Path $EMAIL_FILE -Value "GitHub Actions run:"
          Add-Content -Path $EMAIL_FILE -Value "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Add-Content -Path $EMAIL_FILE -Value ""
          Add-Content -Path $EMAIL_FILE -Value "This email was automatically generated by GitHub Actions."


      # =========================================================
      # SEND EMAIL
      # =========================================================
      - name: Send Summary by Email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}

          from: ${{ secrets.GMAIL_USERNAME }}
          to: ${{ secrets.EMAIL_TO }}

          subject: "ESET KeyGen - Generated Account/Key"

          body: file://${{ github.workspace }}/email-body.txt
